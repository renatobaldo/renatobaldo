name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['theme/**']

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    # L'ambiente "production" con Required reviewers blocca il job finché non approvi su GitHub.
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Chiave SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/sg_deploy
          chmod 600 ~/.ssh/sg_deploy
      - name: Backup e deploy
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ vars.SG_PORT || '18765' }}
          THEME_PATH: ${{ vars.PROD_THEME_PATH }}
          SSH_KEY: /home/runner/.ssh/sg_deploy
          RSYNC_DELETE: ${{ vars.RSYNC_DELETE || 'false' }}
          BACKUP: 'true'
        run: ./scripts/deploy.sh
